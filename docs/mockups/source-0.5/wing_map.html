<!-- Plan of wing 4 (the chapel, its crypt and the basement under the west wing) for owner
     approval: a proposal, drawn 2026-11-17 before anything is built (docs/DESIGN_0.5.md). -->
<svg width="1280" height="720" viewBox="0 0 1280 720" font-family="DejaVu Sans Mono, monospace">
  <rect width="1280" height="720" fill="#11151b"/>
  <text x="40" y="38" fill="#e8f0ff" font-size="21" font-weight="bold">WING 4 — THE CHAPEL AND THE BASEMENT (proposed plan)</text>
  <g fill="#8892a2" font-size="11" font-weight="bold"><text x="40" y="66">THE CHAPEL (courtyard)</text><text x="40" y="378">THE CRYPT (under the chapel)</text><text x="450" y="66">THE BASEMENT (under the west wing)</text></g>

  <!-- The chapel: nave, altar, the plinth -->
  <rect x="40" y="76" width="380" height="260" fill="#232a35" stroke="#c9d2e0" stroke-width="2"/>
  <rect x="160" y="86" width="140" height="44" fill="#2d2533" stroke="#c9d2e0" stroke-width="1"/>
  <text x="230" y="104" fill="#ffe27a" font-size="12" text-anchor="middle">ALTAR</text>
  <text x="230" y="121" fill="#c9d2e0" font-size="11" text-anchor="middle">her plinth before it</text>
  <circle cx="230" cy="148" r="9" fill="#ff8a7d"/>
  <text x="246" y="152" fill="#ff8a7d" font-size="11">St. Agnes (the watcher)</text>
  <g fill="#3a4250"><rect x="70" y="180" width="120" height="10"/><rect x="270" y="180" width="120" height="10"/><rect x="70" y="205" width="120" height="10"/><rect x="270" y="205" width="120" height="10"/><rect x="70" y="230" width="120" height="10"/><rect x="270" y="230" width="120" height="10"/><rect x="70" y="255" width="120" height="10"/><rect x="270" y="255" width="120" height="10"/></g>
  <text x="56" y="292" fill="#c9d2e0" font-size="11">pews; candles; the five children's names</text>
  <text x="56" y="307" fill="#c9d2e0" font-size="11">on a board by the font</text>
  <text x="56" y="322" fill="#7dff8a" font-size="11">her hand, lamb and palm go back on her</text>
  <rect x="205" y="330" width="50" height="12" fill="#11151b" stroke="#c9d2e0" stroke-width="2"/>
  <text x="262" y="356" fill="#ff8a7d" font-size="11">door: the courtyard</text>
  <rect x="380" y="96" width="30" height="40" fill="#1b2029" stroke="#c9d2e0" stroke-width="1"/>
  <text x="412" y="174" fill="#ff8a7d" font-size="11" text-anchor="end">steps down ▾</text>

  <!-- The crypt -->
  <rect x="40" y="388" width="380" height="150" fill="#232a35" stroke="#c9d2e0" stroke-width="2"/>
  <text x="56" y="410" fill="#ffe27a" font-size="13">CRYPT</text>
  <g fill="#3a4250" stroke="#8892a2"><rect x="70" y="424" width="44" height="30"/><rect x="128" y="424" width="44" height="30"/><rect x="186" y="424" width="44" height="30"/><rect x="244" y="424" width="44" height="30"/><rect x="302" y="424" width="44" height="30"/></g>
  <g fill="#c9d2e0" font-size="9" text-anchor="middle"><text x="92" y="443">AGNES</text><text x="150" y="443">T.HALE</text><text x="208" y="443">M.ROWE</text><text x="266" y="443">S.PIKE</text><text x="324" y="443">E.CARR</text></g>
  <text x="56" y="478" fill="#c9d2e0" font-size="11">① five memorial plaques: set them in the order</text>
  <text x="56" y="493" fill="#c9d2e0" font-size="11">the roll struck the children off (wing 2)</text>
  <text x="56" y="510" fill="#7dff8a" font-size="11">→ the niche: her fourth piece</text>
  <text x="56" y="527" fill="#c9d2e0" font-size="11">candles, the Founder's tablet, damp</text>

  <!-- The basement -->
  <rect x="450" y="76" width="130" height="120" fill="#1b2029" stroke="#c9d2e0" stroke-width="2"/>
  <text x="460" y="96" fill="#ffe27a" font-size="12">STAIRS FOOT</text>
  <text x="460" y="114" fill="#c9d2e0" font-size="11">from the west</text>
  <text x="460" y="129" fill="#c9d2e0" font-size="11">wing's gate</text>
  <text x="460" y="146" fill="#c9d2e0" font-size="11">(open once she</text>
  <text x="460" y="161" fill="#c9d2e0" font-size="11">is whole)</text>
  <text x="460" y="186" fill="#ff8a7d" font-size="11">up: the wards</text>
  <rect x="590" y="76" width="200" height="120" fill="#232a35" stroke="#c9d2e0" stroke-width="2"/>
  <text x="600" y="96" fill="#ffe27a" font-size="12">COAL STORE</text>
  <text x="600" y="114" fill="#c9d2e0" font-size="11">where Tommy was sent</text>
  <text x="600" y="129" fill="#c9d2e0" font-size="11">for coal (wing 2)</text>
  <text x="600" y="146" fill="#7dff8a" font-size="11">bottles, stones to throw</text>
  <rect x="800" y="76" width="200" height="120" fill="#232a35" stroke="#c9d2e0" stroke-width="2"/>
  <text x="810" y="96" fill="#ffe27a" font-size="12">LAUNDRY CHUTE</text>
  <text x="810" y="114" fill="#c9d2e0" font-size="11">sheets come down from</text>
  <text x="810" y="129" fill="#c9d2e0" font-size="11">the wards; a staff room,</text>
  <text x="810" y="144" fill="#c9d2e0" font-size="11">lockers to hide in</text>
  <rect x="1010" y="76" width="230" height="120" fill="#33242a" stroke="#c9d2e0" stroke-width="2"/>
  <text x="1020" y="96" fill="#ffe27a" font-size="12">THE FOUNDER'S DOOR</text>
  <text x="1020" y="114" fill="#c9d2e0" font-size="11">locked: no handle,</text>
  <text x="1020" y="129" fill="#c9d2e0" font-size="11">no keyhole (0.6: the</text>
  <text x="1020" y="144" fill="#c9d2e0" font-size="11">secret, Little Aggie)</text>

  <rect x="450" y="206" width="790" height="40" fill="#1b2029" stroke="#c9d2e0" stroke-width="2"/>
  <text x="845" y="231" fill="#ffe27a" font-size="12" text-anchor="middle">THE COLD CORRIDOR — pipes overhead, water on the floor</text>
  <circle cx="490" cy="226" r="7" fill="#ff8a7d"/>
  <text x="504" y="262" fill="#ff8a7d" font-size="11">← the surgeon's round (he hears only)</text>

  <rect x="450" y="272" width="300" height="196" fill="#232a35" stroke="#c9d2e0" stroke-width="2"/>
  <rect x="460" y="360" width="280" height="98" fill="#1d3344" opacity="0.9"/>
  <text x="460" y="292" fill="#ffe27a" font-size="13">BOILER ROOM</text>
  <text x="460" y="310" fill="#c9d2e0" font-size="11">flooded to the knee; the boiler</text>
  <text x="460" y="325" fill="#c9d2e0" font-size="11">cold; Sam knocks on the pipes</text>
  <text x="460" y="342" fill="#c9d2e0" font-size="11">② three valves drain the flood</text>
  <text x="470" y="384" fill="#7fd7ff" font-size="11">the water</text>
  <text x="470" y="404" fill="#7dff8a" font-size="11">Sam's tin soldier, under it</text>
  <text x="470" y="424" fill="#c9d2e0" font-size="11">drained: the boiler roars</text>
  <rect x="760" y="272" width="230" height="196" fill="#232a35" stroke="#c9d2e0" stroke-width="2"/>
  <text x="770" y="292" fill="#ffe27a" font-size="13">MORGUE</text>
  <text x="770" y="310" fill="#c9d2e0" font-size="11">cold drawers, sheets</text>
  <text x="770" y="325" fill="#c9d2e0" font-size="11">③ drawers by date, not</text>
  <text x="770" y="340" fill="#c9d2e0" font-size="11">name (wings 2 and 3);</text>
  <text x="770" y="355" fill="#c9d2e0" font-size="11">the children's drawers</text>
  <text x="770" y="370" fill="#c9d2e0" font-size="11">are empty: tags only</text>
  <text x="770" y="392" fill="#7dff8a" font-size="11">T. Hale's file, page 4</text>
  <text x="770" y="410" fill="#c9d2e0" font-size="11">lockers to hide in</text>
  <text x="770" y="428" fill="#c9d2e0" font-size="11">a drawer slides out</text>
  <text x="770" y="443" fill="#c9d2e0" font-size="11">by itself</text>
  <rect x="1000" y="272" width="240" height="196" fill="#2d2533" stroke="#c9d2e0" stroke-width="2"/>
  <text x="1010" y="292" fill="#ffe27a" font-size="13">THE THEATRE</text>
  <text x="1010" y="310" fill="#c9d2e0" font-size="11">the surgeon's table under</text>
  <text x="1010" y="325" fill="#c9d2e0" font-size="11">its lamp; a gallery behind</text>
  <text x="1010" y="340" fill="#c9d2e0" font-size="11">glass, empty chairs</text>
  <text x="1010" y="358" fill="#c9d2e0" font-size="11">④ the cabinet: the music</text>
  <text x="1010" y="373" fill="#c9d2e0" font-size="11">box's missing note</text>
  <text x="1010" y="396" fill="#ff8a7d" font-size="11">Nora, strapped to the</text>
  <text x="1010" y="411" fill="#ff8a7d" font-size="11">table: free her or</text>
  <text x="1010" y="426" fill="#ff8a7d" font-size="11">leave her</text>

  <g fill="#7fd7ff" font-size="11">
    <text x="450" y="496" font-size="13">ROUTE</text>
    <text x="450" y="514">1 The courtyard: dead calm coming; St. Agnes is no longer at the chapel door</text>
    <text x="450" y="529">2 The chapel: her hand, lamb and palm go back on her, your eyes on her</text>
    <text x="450" y="544">3 The crypt ①: the plaques in the roll's order → her fourth piece</text>
    <text x="450" y="559">4 She is whole: the bell, the storm stops, the basement gate unlocks</text>
    <text x="450" y="574">5 Down from the west wing: the surgeon crosses ahead; he stops at a sound</text>
    <text x="450" y="589">6 Coal store: things to throw · 7 Boiler room ②: Sam, the flood, his soldier</text>
    <text x="450" y="604">8 Morgue ③: the drawers by date → file page 4; lockers</text>
    <text x="450" y="619">9 The theatre ④: the missing note opens the cabinet; Nora: free her or leave her</text>
    <text x="450" y="634">10 Up through the wards (Sister M.), the courtyard: the front gate, or your room:</text>
    <text x="450" y="649">   the ending by your sanity and whether Nora is with you</text>
    <text x="450" y="672" fill="#c9d2e0">The surgeon hears only: crouch, hold your breath (Space), throw to lure him;</text>
    <text x="450" y="687" fill="#c9d2e0">his tools clink as he walks, and stop when he hears you. The flash stuns him.</text>
  </g>
  <g font-size="11"><text x="40" y="568" fill="#ffe27a">KEY</text><text x="40" y="586" fill="#7dff8a">■ found / given</text><text x="40" y="602" fill="#ff8a7d">■ threats, ways out</text><text x="40" y="618" fill="#7fd7ff">■ route</text><text x="40" y="634" fill="#c9d2e0">① – ④ puzzles</text></g>
</svg>
